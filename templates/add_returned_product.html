
{% extends "base.html" %}

{% block content %}

<div class="module-page">

    <div class="module-header">
        <div>
            <span class="module-eyebrow">RECALL OPERATIONS</span>
            <h1>Record Returned Product</h1>
            <p>Record an item received back as part of a product recall.</p>
        </div>
    </div>

    <div class="form-card">

        {% if error %}
        <p style="color: #B91C1C; margin-bottom: 20px;">
            {{ error }}
        </p>
        {% endif %}

        <form method="POST" action="{{ url_for('add_returned_product') }}">

            <div class="form-grid">

                <div class="module-form-group">
                    <label for="recall_id">Recall Record</label>
                    <select id="recall_id" name="recall_id" required>
                        <option value="">Select a recall</option>
                        {% for recall in recalls %}
                        <option value="{{ recall.id }}">
                            #{{ recall.id }} — {{ recall.recall_type }}
                            {% if recall.batch_number %}
                                — {{ recall.batch_number }}
                            {% endif %}
                            {% if recall.product_code %}
                                — {{ recall.product_code }}
                            {% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="module-form-group">
                    <label for="product_id">Returned Product</label>
                    <select id="product_id" name="product_id" required>
                        <option value="">Select a product</option>
                        {% for product in products %}
                        <option value="{{ product.id }}">
                            {{ product.product_code }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="module-form-group">
                    <label for="returned_by">Returned By</label>
                    <input
                        type="text"
                        id="returned_by"
                        name="returned_by"
                        placeholder="Distributor or retailer name"
                        required
                    >
                </div>

                <div class="module-form-group">
                    <label for="return_date">Return Date</label>
                    <input
                        type="date"
                        id="return_date"
                        name="return_date"
                        required
                    >
                </div>

                <div class="module-form-group full-width">
                    <label for="condition_description">Product Condition</label>
                    <textarea
                        id="condition_description"
                        name="condition_description"
                        rows="3"
                        placeholder="Describe the returned product's condition..."
                        required
                    ></textarea>
                </div>

            </div>

            <div class="form-actions">
                <a href="{{ url_for('returned_products') }}" class="cancel-button">
                    Cancel
                </a>

                <button type="submit" class="module-button">
                    Record Return
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
