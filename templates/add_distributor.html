
{% extends "base.html" %}

{% block content %}

<div class="module-page">

    <div class="module-header">
        <div>
            <span class="module-eyebrow">SUPPLY CHAIN MANAGEMENT</span>
            <h1>Add Distributor</h1>
            <p>Register a distribution partner in your supply chain.</p>
        </div>
    </div>

    <div class="form-card">
        <form method="POST" action="{{ url_for('add_distributor') }}">

            <div class="form-grid">

                <div class="module-form-group">
                    <label for="name">Distributor Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter distributor name"
                        required
                    >
                </div>

                <div class="module-form-group">
                    <label for="location">Location *</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Hyderabad, Telangana"
                        required
                    >
                </div>

                <div class="module-form-group">
                    <label for="contact">Contact Number</label>
                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="Enter contact number"
                    >
                </div>

            </div>

            <div class="form-actions">
                <a href="{{ url_for('distributors') }}" class="cancel-button">
                    Cancel
                </a>
                <button type="submit" class="module-button">
                    Save Distributor
                </button>
            </div>

        </form>
    </div>

</div>

{% endblock %}
