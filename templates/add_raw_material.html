{% extends "base.html" %}

{% block title %}
Add Raw Material - ProductTrace
{% endblock %}

{% block content %}

<section class="module-page">

    <div class="module-header">

        <div>
            <span class="module-eyebrow">SUPPLY CHAIN</span>

            <h1>Add Raw Material</h1>

            <p>
                Record a raw material received for production.
            </p>
        </div>

    </div>


    <div class="form-card">

        <form method="POST" class="module-form">

            <div class="form-grid">

                <div class="module-form-group">

                    <label for="name">
                        Material Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Example: Plastic Resin"
                        required
                    >

                </div>


                <div class="module-form-group">

                    <label for="supplier_name">
                        Supplier Name
                    </label>

                    <input
                        type="text"
                        id="supplier_name"
                        name="supplier_name"
                        placeholder="Enter supplier name"
                    >

                </div>


                <div class="module-form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        id="quantity"
                        name="quantity"
                        placeholder="Enter quantity"
                    >

                </div>


                <div class="module-form-group">

                    <label for="unit">
                        Unit
                    </label>

                    <input
                        type="text"
                        id="unit"
                        name="unit"
                        placeholder="Example: kg"
                    >

                </div>


                <div class="module-form-group">

                    <label for="received_date">
                        Received Date
                    </label>

                    <input
                        type="date"
                        id="received_date"
                        name="received_date"
                        required
                    >

                </div>

            </div>


            <div class="form-actions">

                <a href="{{ url_for('raw_materials') }}"
                   class="cancel-button">
                    Cancel
                </a>

                <button type="submit"
                        class="module-button">
                    Save Material
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
